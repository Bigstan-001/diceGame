<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="player-0-area active">
        <div class="top">
          <h1>Player 1</h1>
          <span class="player-0-score player-scr">0</span>
        </div>
        <div class="bottom">
          <h1>Current Score</h1>
          <span class="current-0-score player-scr">0</span>
        </div>
      </div>

      <div class="player-1-area">
        <div class="top">
          <h1>Player 2</h1>
          <span class="player-1-score player-scr">0</span>
        </div>
        <div class="bottom">
          <h1>Current Score</h1>
          <span class="current-1-score player-scr">0</span>
        </div>
      </div>
      <div class="center-field">
        <div class="up">
          <img src="dice-1.png" id="img-0" alt="" />
          <img src="dice-2.png" id="img-1" alt="" />
        </div>
        <div class="down">
          <button class="roll-btn">Roll Dice</button>
          <button class="hold-btn">Hold</button>
        </div>
      </div>
      <div class="winner hide">
        <div class="winnerBox">
          <h1 class="winnerText">WINNER!!!!!!!</h1>
          <img src="jakeTheDancer.gif" alt="" width="200px" height="200px" />
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
